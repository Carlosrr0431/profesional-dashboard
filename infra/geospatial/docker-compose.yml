# Stack local para probar OSRM + Nominatim antes de desplegar en Railway.
# Requiere salta.osm.pbf en ./data/ (ver scripts/prepare-osm-data).

services:
  osrm:
    build: ./osrm
    ports:
      - "5000:5000"
    environment:
      DATA_DIR: /data
      MAP_NAME: salta
      PBF_PATH: /data/salta.osm.pbf
      PORT: "5000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  nominatim:
    build: ./nominatim
    ports:
      - "8080:8080"
    environment:
      PBF_PATH: /nominatim/data/salta.osm.pbf
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_TIGER: "false"
      IMPORT_GB_POSTCODES: "false"
      THREADS: "2"
      FREEZE: "true"
      NOMINATIM_PASSWORD: local-dev-password
      PORT: "8080"
    volumes:
      - nominatim-db:/var/lib/postgresql/16/main
      - ./data:/nominatim/data
    shm_size: 1gb
    restart: unless-stopped

volumes:
  nominatim-db:
